# NOTE: no [project] table on purpose. Runtime deps live in requirements.txt
# and one-off runs use `uv run --with ...` (fully ephemeral). The package
# itself lives under src/ (src layout) and is found via pythonpath below —
# never installed, never copied.

[tool.pytest.ini_options]
# Product test policy:
# - Plain `pytest` runs FAST unit tests only (no Ollama, no whisper-server,
#   no network). Ollama-backed tests are expensive on CPU/GPU and never run
#   in CI (there is no test CI workflow by design).
# - Mark any test that calls Ollama with @pytest.mark.integration and run it
#   manually when needed: `pytest -m integration` (CLI -m overrides addopts).
#   Integration tests are SERIAL ONLY: one LLM request at a time (hardware
#   holds a single loaded model). Never add parallel runners (pytest-xdist,
#   workers) for integration paths, and gate on lfm2.5 first
#   (`--models lfm2.5:latest`); memory hogs such as gemma4:e4b-mlx stay out.
# - The E1 eval gate (src/text_c3po/services/eval_harness.py) is a manual-only
#   script, not a pytest test: run `PYTHONPATH=src python -m
#   text_c3po.services.eval_harness [--models ...]` explicitly when gate
#   evidence is needed.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not integration"]
markers = [
    "integration: calls a live Ollama model over loopback; manual invocation only, never CI",
]
