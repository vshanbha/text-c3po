[[entry]]
id = 3
type = "story"
title = "Live-tuning controls"
description = "Owner manual test 2026-09-16 (F7): voice-to-caption lag is seconds and word fidelity imperfect. live-translate already solves the tunable half: --max-utterance (latency vs context trade-off), --lang pin (steadier than auto-detect), --model small/medium choice, and --silence-rms tuning. Expose these four as Live-view controls over the existing constants (MAX_UTTERANCE_S, whisper -l, WHISPER_MODEL, SILENCE_RMS), with the PoC README's trade-off guidance as helper text. Whisper translate-task and faster-whisper local inference stay out by design (AD-7, D7-A)."
