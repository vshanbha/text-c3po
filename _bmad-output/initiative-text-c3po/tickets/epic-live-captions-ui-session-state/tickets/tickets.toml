title = "Captions pane with history and timestamps"
description = "Build ui/live_view captions ListView appending rows in utterance-completion order with mono timestamps, auto-follow plus scroll-back escape and Jump-to-latest, utterance-flush only per CAP-1."
verify = "Each caption shows translated text plus timestamp in utterance-completion order; utterance-flush granularity only, no token streaming."
covers = ["R1"]
after = []
hitl = false
