# The entries in build order, inside the epic's tickets/ folder.
# One [[entry]] table per planned story; covers cites the epic's R ids.

[[entry]]
id = 1
type = "story"
title = "Session controller with owned caption list"
description = "Add services/session as sole mutator of the ordered in-memory caption list draining the utterance queue; mode switch preserves the list while new Start or app close clears it per CAP-3."
verify = "Mode switch away and back never clears the list; no cross-restart persistence required (memory-only)."
covers = ["R3"]
after = []
hitl = false
risk = "low"

