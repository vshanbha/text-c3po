[[entry]]
id = 9
type = "story"
title = "File logging with rotation and per-module diagnostics"
description = "Give the packaged app a persistent log: _configure_logging keeps the console handler and adds a stdlib RotatingFileHandler at ~/Library/Logs/text-c3po/text-c3po.log (1 MB x 3, TEXT_C3PO_LOG path override, console-only fallback when the dir is unwritable). Wire per-module loggers into the silent zones the 2026-09 audit ranked: process_manager spawn/ready/stop/restart reasons, whisper_client transport cause, asr decode/transcribe causes, live_runner stream-end and transcribe-failure causes, audio_devices enumeration failure, ollama_client probe reason, and the app.py whisper boot thread; gate the translate parse-failure raw-payload dump so translated content never reaches the file log; never log audio bytes or transcripts; keep TEST-PLAN translate_text ok and done_reason lines at their current levels and add a log-file cross-check row per CAP."
verify = "Give the packaged app a persistent log: _configure_logging keeps the console handler and adds a stdlib RotatingFileHandler at ~/Library/Logs/text-c3po/text-c3po.log (1 MB x 3, TEXT_C3PO_LOG path override, console-only fallback when the dir is unwritable)."
