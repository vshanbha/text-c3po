- id: "1"
  title: setup.sh for clean-machine install
  description: >-
    Add setup.sh covering Ollama install, model pull, PortAudio/sounddevice,
    ffmpeg check, and BlackHole guidance; clean-machine run completes in
    <=15 min with missing BlackHole as guidance per CAP-1.
- id: "2"
  title: Extend harness to the full 23-language matrix
  description: >-
    Extend services/eval_harness from the E1 5x5 gate to sample sentences
    by all 23 languages by installed models, recording per-language scores
    and JSON-validity to research.md with comparable rows per CAP-2.
  invoke_dev_with: >-
    Reuse the translation service with model as parameter; never gate UI
    combos on scores.
- id: "3"
  title: Package macOS bundle with mic permission
  description: >-
    Ship the installable macOS bundle (flet build macos or PyInstaller
    --windowed decision recorded) carrying NSMicrophoneUsageDescription so
    first Live start prompts and TCC grants mic access per CAP-3.
  invoke_dev_with: >-
    D5-A approved 2026-09-13: tool of record is `flet build macos`
    (PyInstaller not chosen); ad-hoc local bundle only, no sign/notarize;
    document Gatekeeper copy path for another Mac. Bundle runs loopback-only
    to 127.0.0.1:11434 and 127.0.0.1:9001 after download; verify with the
    loopback-only check. Manual session per TEST-PLAN section H.
- id: "4"
  title: Regression tests for VAD parser and whisper health
  description: >-
    Add tests covering VAD silence-threshold and max-utterance flush paths,
    JSON parser valid-plus-malformed cases, and whisper-server health;
    suite passes post-setup.sh per CAP-4.
- id: "5"
  title: Remove cloud surface and refresh docs
  description: >-
    Delete all langchain-openai code and secrets.toml, then refresh README
    and AGENTS.md with the true Flet run, smoke, and harness commands;
    grep plus absence check both return empty per CAP-5.
  invoke_dev_with: >-
    Never commit secrets; do not use streamlit run to verify v2.
- id: "6"
  title: Publish updated docs to GitHub Pages
  description: >-
    Replace the stub docs/index.html hosting experiment with a real docs
    landing page reflecting current v2 content (run guide, eval research,
    architecture); push to master updates the site via the existing
    static.yml Pages workflow per CAP-6.
  done_checkpoint: true
- id: "7"
  title: Fix unit CI and repair sprint tracking
  description: >-
    Make the web-serve smoke runnable where uv is absent (invoke the test
    interpreter directly, install uv, or skip explicitly) and stop masking
    the empty-collection exit code, so the master unit run is green again;
    reconcile stories.yaml with sprint-status.yaml and track the Pages story.
  invoke_dev_with: >-
    2026-09-13 audit: CI run 34746382984 is RED on master with
    FileNotFoundError 'uv' from test_web_smoke.py; tests.yml installs pip
    only and its `|| [ $? -eq 5 ]` mask hides a zero-collection break. This
    is an ops fix, not a product decision — choose the minimal durable
    option and keep plain pytest fast and hermetic.
- id: "8"
  title: Refresh stale v1 docs and infra
  description: >-
    Update the parent workspace AGENTS.md (still describes Streamlit +
    OpenAI + secrets.toml), fix the .devcontainer (Python 3.11, nonexistent
    text-c3po/app.py, Streamlit 8501), remove the stale "no test CI
    workflow" comment in pyproject.toml, and pin docs/requirements.txt.
    Include D1-A (ratify commentary cut: fix README.md:4 + E1 SPEC Success
    signal to formal/informal/origin_language) and D6-B (track uv.lock:
    remove from .gitignore + stale comment, commit lock).
  invoke_dev_with: >-
    2026-09-13 audit hygiene items; no behavior change. Keep requirements.txt
    and pyproject [project] dependencies identical (test_dependency_pins_agree).
    D1 docs-only, D6 reproducible `uv sync` for clean-machine goal.
