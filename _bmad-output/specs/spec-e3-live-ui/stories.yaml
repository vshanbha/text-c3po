- id: "1"
  title: Session controller with owned caption list
  description: >-
    Add services/session as sole mutator of the ordered in-memory caption
    list draining the utterance queue; mode switch preserves the list while
    new Start or app close clears it per CAP-3.
  invoke_dev_with: >-
    Only the main thread touches Flet controls; background threads post to
    the queue the controller drains.
- id: "2"
  title: Captions pane with history and timestamps
  description: >-
    Build ui/live_view captions ListView appending rows in
    utterance-completion order with mono timestamps, auto-follow plus
    scroll-back escape and Jump-to-latest, utterance-flush only per CAP-1.
  invoke_dev_with: >-
    Follow DESIGN.md caption-row and EXPERIENCE.md captions-pane rules;
    announce each new row via live region at utterance granularity.
- id: "3"
  title: Start-Stop toggle with live status indicators
  description: >-
    Wire the Start/Stop FilledButton (label is the state) with capture,
    whisper-latency, and model dot-plus-label indicators reflecting live
    state; Stop halts capture within 2s and restart needs no relaunch
    per CAP-2.
  invoke_dev_with: >-
    Live red is capture-running only; recoverable failures render inline
    in the failing row plus SnackBar retry, never a dialog.
- id: "4"
  title: Live pickers, file surface, and session-state polish
  description: >-
    Bind device, source, and target Dropdowns to the E2 enumeration and
    the 23-language constant with auto-detect-where-supported source
    default; compose the file surface (picker row, progress, results list
    reusing the caption-row pattern) on the E2 decode path; verify
    mode-switch retention and memory-only session labeling per CAP-4
    and CAP-3.
  done_checkpoint: true
  invoke_dev_with: >-
    Any model-by-language combo stays submittable; quality is measured in
    E4, never gated here.
- id: "5"
  title: Fix captions auto-follow and Jump-to-latest wiring
  description: >-
    Forward the ListView scroll event from feed.on_scroll into
    on_pane_scroll so _is_user_scroll can distinguish ScrollType.USER from
    programmatic auto-scrolls; follow disables only on a genuine user
    scroll and Jump-to-latest re-enables it per CAP-1.
  invoke_dev_with: >-
    2026-09-13 audit defect: captions.py _on_scroll() drops the event, so
    the USER filter is unreachable and every scroll (including the
    auto-scroll and the Jump scroll itself) turns follow off. Verify the
    installed flet OnScrollEvent shape before patching; add a regression
    test that drives a non-USER event and asserts follow stays on, and a
    USER event and asserts it turns off. Re-run TEST-PLAN F5.
- id: "6"
  title: Decouple translation from capture loop and label overflow
  description: >-
    Keep the LLM drain off the capture read path so LiveRunner keeps
    reading frames during an in-flight translation, and surface PortAudio
    overflow / dropped frames as labeled gap rows per AD-8 rather than
    discarding the read overflow flag per CAP-1 and NFR-1.
  invoke_dev_with: >-
    2026-09-13 audit defect: _submit() calls the on_utterance callback that
    drains and translates synchronously inside the read loop, while
    stream.read's _overflow flag is discarded — speech during a translation
    can be silently dropped, contradicting AD-8. Preserve the existing
    gap-row contract; no silent drops. Verify capture continuity and that a
    forced overflow produces a gap row.
- id: "7"
  title: Fix session queue and seq races on start and gap
  description: >-
    Assign the mark_gap sequence number and append the caption under one
    lock acquisition so an interleaved drain cannot reorder rows, and stop
    start_session silently discarding queued utterances — label them as a
    gap per AD-8 instead per CAP-3.
  invoke_dev_with: >-
    2026-09-13 audit defect: session.py mark_gap increments _seq and appends
    under two separate lock acquisitions, and start_session's _drain_queue
    throws away just-posted utterances with no gap row. Keep the translate
    call outside the lock. Add deterministic race tests (interleaver) and a
    stop-then-restart test asserting no silent drop.
- id: "8"
  title: Relabel source picker to Auto-detect (D2-A)
  description: >-
    Remove the false affordance of the Live/File source-language dropdown:
    relabel as read-only Auto-detect (or remove) to match the `-l auto`
    whisper behavior per D2-A approved 2026-09-13; functional per-language
    whisper restart deferred out of v1.
  invoke_dev_with: >-
    D2-A v1 decision: honest UI matching transcribe auto-detect; File mode
    source value stays unread; update DESIGN/EXPERIENCE source-picker copy.
    Verify TEST-PLAN C1-C3 still pass with Auto-detect shown.
- id: "9"
  title: Serialize background UI updates through one render point
  description: >-
    Route every background page.update() through the serialized
    _ui_update(page) helper, leaving only main-thread event handlers as
    direct callers, per the 2026-09-13 D3 re-decision (B+ tolerance; the
    literal run_thread pump was rejected because it runs in an executor
    thread); record AD-4 as the single serialized render point.
  invoke_dev_with: >-
    E3-6 already shrank the concurrency surface. Do not add page.run_thread
    or an asyncio pump (deferred a-lite). Add an AST tripwire plus a
    re-entrancy concurrency test. Verified by TEST-PLAN F1/F5 under load;
    no new ASR or translation logic.
- id: "10"
  title: Document and test global Stop scope (D4-A)
  description: >-
    Document Text Stop as global abort (cancels every registered
    stream/HTTP client including File and caption-retry) per D4-A approved
    2026-09-13 (owner override of per-mode); add unit test asserting
    concurrent File/retry work is aborted by Text Stop.
  invoke_dev_with: >-
    Least-surprise overridden by owner intent: one Stop cancels everything;
    a per-mode abort would need explicit new control. Update UX copy.
