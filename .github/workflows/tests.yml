# Unit checks that stay green on every commit. Ollama-backed tests NEVER run
# here by design: they are expensive on CPU/GPU and manual-only
# (`pytest -m integration`, plus the eval-harness gate script). The default
# pytest run deselects them via pyproject.toml; the explicit -m below makes
# the exclusion obvious in CI logs too.
name: Unit checks

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Pinned-exact per requirements.txt (== pyproject [project]; D6-B tracks
        # uv.lock for `uv sync --frozen` clean-machine installs — CI stays on
        # pip here by design, no uv on the runner).
        run: pip install -r requirements.txt pytest
      - name: Syntax check (no deps, no Ollama)
        run: python -m compileall -q src tests
      - name: Unit tests (integration deselected)
        run: pytest -q -m "not integration"
